name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -200 || true

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/pdf-arabi.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-arabi-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: محرّر PDF 1.0.${{ github.run_number }}
          body: |
            حمّل **pdf-arabi.apk** وثبّتو على التليفون.
            كل نسخة جديدة تتثبّت فوق القديمة من غير ما تفسخ حاجة.
          files: out/*.apk
          make_latest: true
